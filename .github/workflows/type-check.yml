name: type-check

# Non-blocking mypy run on every PR. The job is allowed to fail
# (``continue-on-error: true``) so it does not break CI for contributors who
# touch files outside the typed subset, but it surfaces regressions clearly
# in the PR view and prepares the project for a future strict gate.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["*"]

jobs:
  mypy:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install braindecode (with test extras)
        run: uv pip install --system -e .[tests,typing]

      - name: Run mypy
        run: mypy --config-file pyproject.toml braindecode
