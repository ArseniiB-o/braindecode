name: tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - '*' # all branches, including forks

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "macos-latest", "windows-latest" ]
        python-version: [ "3.12", "3.13" ] # , "3.11", "3.14"]
    steps:
    ## Install Braindecode
    - name: Checking Out Repository
      uses: actions/checkout@v4
    # Cache MNE Data
    # The cache key includes the OS and a hash of pyproject.toml to invalidate
    # when dependencies change. This ensures that test data is fresh when
    # the test configuration changes.
    - name: Create/Restore MNE Data Cache
      id: cache-mne_data
      uses: actions/cache@v4
      with:
        path: ~/mne_data
        key: test-2-${{ runner.os }}-${{ matrix.python-version }}
        restore-keys: |
          test-2-${{ runner.os }}-${{ matrix.python-version }}-
          test-2-${{ runner.os }}-
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Show Python Version
      run: python --version
    - name: Install Braindecode from Current Checkout
      run: uv pip install --system -e .[all]
    # Show Braindecode Version
    - run: python -c "import braindecode; print(braindecode.__version__)"

    ## Run Tests
    # ``-n auto`` distributes the suite across all available CPUs via
    # ``pytest-xdist``. The Codecov collector requires --cov to write a single
    # combined XML; pytest-xdist + pytest-cov handle that automatically.
    # See https://stackoverflow.com/a/59959080/1469195 for the cov-report logic.
    - name: Run Tests
      env:
        HF_TOKEN_REVE: ${{ secrets.HF_TOKEN_REVE }}
      run: pytest -n auto --dist=loadscope --cov=braindecode test/ --cov-report term --cov-report xml:coverage.xml
    # Coverage is uploaded once per CI run from the lowest supported Python on
    # Ubuntu. Keep this guard in sync with the python-version matrix above —
    # historically the guard pinned a version (3.11) that was no longer in the
    # matrix, which silently disabled all coverage uploads.
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
      with:
        fail_ci_if_error: true
        file: ./coverage.xml
        env_vars: OS,PYTHON
        token: ${{ secrets.CODECOV_TOKEN }}
