[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "braindecode"
dynamic = ["version"]
description = "Deep learning software to decode EEG, ECG or MEG signals"
authors = [
    { name = "Robin Tibor Schirrmeister", email = "robintibor@gmail.com" },
    { name = "Bruno Aristimunha Pinto", email = "b.aristimunha@gmail.com" },
    { name = "Alexandre Gramfort", email = "agramfort@meta.com" },
]
maintainers = [
    { name = "Alexandre Gramfort", email = "agramfort@meta.com" },
    { name = "Bruno Aristimunha Pinto", email = "b.aristimunha@gmail.com" },
    { name = "Robin Tibor Schirrmeister", email = "robintibor@gmail.com" },
]
license = { text = "BSD-3-Clause" }
keywords = [
    "python",
    "deep-learning",
    "neuroscience",
    "pytorch",
    "meg",
    "eeg",
    "neuroimaging",
    "electroencephalography",
    "magnetoencephalography",
    "electrocorticography",
    "ecog",
    "electroencephalogram",
]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: BSD License',
    'Operating System :: OS Independent',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'Topic :: Scientific/Engineering :: Medical Science Apps.',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Typing :: Typed',
]
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    'mne>=1.11.0',  # we get matplotlib, numpy, scipy from here
    'mne_bids>=0.18', # in theory we get the mne here, but we prefer to have it explicit
    'h5py',
    'skorch>=1.3.0',
    'joblib',
    'torchinfo',
    'pandas',
    'wfdb>=4.3.1',  # requests comes transitively via mne→pooch and wfdb
    # NOTE: ``linear_attention_transformer`` moved to the optional ``[biot]``
    # extra — it is only required by ``models.biot.BIOT`` and friends. See
    # ``braindecode/models/biot.py::_import_linear_attention_transformer``.
    'docstring_inheritance',        # we get einops from here
    'rotary_embedding_torch',
    'pydantic>=2.0',
]

[tool.uv]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",  # Intel Mac
  "sys_platform == 'darwin' and platform_machine == 'arm64'",   # Apple Silicon Mac (M1/M2/M3)
  "sys_platform == 'linux' and platform_machine == 'x86_64'",   # Linux 64-bit
  "sys_platform == 'win32' and platform_machine == 'AMD64'"     # Windows 64-bit
]

[project.urls]
homepage = "https://braindecode.org"
repository = "https://github.com/braindecode/braindecode"
documentation = "https://braindecode.org/stable/index.html"

[project.optional-dependencies]
moabb = ["moabb>=1.4.3"]
eegprep = ["eegprep[eeglabio]>=0.2.23"]
hub = ["huggingface_hub[torch]>=0.20.0", "zarr>=3.0"]
viz = ["captum>=0.7.0"]
# Models with linear-attention transformer backbones (BIOT, InterpolatedBIOT).
biot = ["linear_attention_transformer"]
tests = [
    'pytest',
    'pytest-cov',
    'pytest-xdist',           # parallel test execution (``pytest -n auto``)
    'codecov',
    'pytest_cases',
    'mypy',
    "transformers>=4.57.0",
    "bids_validator",
]
typing = [
    'exca>=0.5.10',
    'numpydantic>=1.7',
]

docs = [
    'sphinx_gallery',
    'sphinx_rtd_theme',
    'sphinx-autodoc-typehints',
    'sphinx-autobuild',
    'sphinxcontrib-bibtex',
    'sphinx_sitemap',
    'sphinxext-opengraph',
    'pydata_sphinx_theme',
    'numpydoc',
    'memory_profiler',
    'pillow',
    'ipython',
    'sphinx_design',
    'lightning',
    'seaborn',
    'pre-commit',
    'openneuro-py>=2026.4.0',  # 2026.4.0 fixes DatasetFile.key->id after the OpenNeuro 5.0.0 schema change; older versions break against the live GraphQL server
    'plotly',
    'shap',
    'nbformat',
    'transformers',
]

all = [
    "braindecode[moabb]",
    "braindecode[tests]",
    "braindecode[docs]",
    "braindecode[hub]",
    "braindecode[eegprep]",
    "braindecode[typing]",
    "braindecode[viz]",
    "braindecode[biot]",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.dynamic]
version = { attr = "braindecode.version.__version__" }

[tool.setuptools.packages.find]
where = ["."] # list of folders that contain the packages (["."] by default)
include = [
    "braindecode*",
] # package names should match these glob patterns (["*"] by default)
exclude = [] # exclude packages matching these glob patterns (empty by default)
namespaces = false # to disable scanning PEP 420 namespaces (true by default)

# Ship the PEP 561 ``py.typed`` marker so downstream projects pick up our
# type hints. Without this, ``mypy`` / Pyright in user code silently treats
# braindecode as untyped even though we ship inline annotations.
[tool.setuptools.package-data]
braindecode = ["py.typed"]

[tool.ruff]
# ``lint.ignore-init-module-imports`` was removed: ruff now handles
# ``__init__.py`` re-exports correctly and the flag emits a deprecation
# warning on every run. Re-exports that should not trip ``F401`` are
# instead expressed via ``__all__`` in each ``__init__.py``.
line-length = 88
target-version = "py311"


[tool.isort]
skip = [".gitignore"]
skip_glob = ["test/*", "examples/*"]
py_version = 311
profile = "black"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["braindecode"]
lines_between_sections = 1

[tool.pytest.ini_options]
testpaths = ["test"]
# which files count as test modules
python_files = ["test_*.py", "*_test.py"]
# which functions inside them count as tests
python_functions = ["test_*"]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
# Baseline mypy config. Strictness is intentionally low so that the project's
# 33%-typed surface compiles cleanly today, while still catching the worst
# regressions (untyped attribute access, redefinitions, import cycles).
# Modules can be tightened individually via additional ``[[tool.mypy.overrides]]``
# blocks as type coverage grows toward the 80% goal tracked in the roadmap.
[tool.mypy]
python_version = "3.11"
files = ["braindecode"]
ignore_missing_imports = true        # MNE / wfdb / skorch ship partial stubs
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = false          # set to true once existing ignores cleaned
no_implicit_optional = true
check_untyped_defs = false           # baseline only — flip per-module below
disable_error_code = ["import-untyped"]

# Strictly typed modules. Add new entries here as files get cleaned up.
[[tool.mypy.overrides]]
module = [
    "braindecode.version",
]
check_untyped_defs = true
disallow_untyped_defs = true

# Third-party libraries without type stubs we want to keep quiet about.
[[tool.mypy.overrides]]
module = [
    "mne.*",
    "mne_bids.*",
    "skorch.*",
    "wfdb.*",
    "torchinfo.*",
    "rotary_embedding_torch.*",
    "linear_attention_transformer.*",
    "docstring_inheritance.*",
    "h5py.*",
    "joblib.*",
    "pandas.*",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "moabb.*",
    "huggingface_hub.*",
    "zarr.*",
    "captum.*",
    "eegprep.*",
]
ignore_missing_imports = true
